<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="calculator">

        <h2>Scientific Calculator</h2>

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button class="function" onclick="clearDisplay()">AC</button>
            <button class="function" onclick="backspace()">⌫</button>
            <button class="function" onclick="append('%')">%</button>
            <button class="operator" onclick="append('/')">÷</button>

            <button onclick="scientific('sin')">sin</button>
            <button onclick="scientific('cos')">cos</button>
            <button onclick="scientific('tan')">tan</button>
            <button class="operator" onclick="append('*')">×</button>

            <button onclick="scientific('log')">log</button>
            <button onclick="scientific('ln')">ln</button>
            <button onclick="scientific('sqrt')">√</button>
            <button class="operator" onclick="append('-')">−</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('+')">+</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button onclick="power()">xʸ</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button onclick="square()">x²</button>

            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button onclick="append('(')">(</button>
            <button onclick="append(')')">)</button>

            <button onclick="append(Math.PI)">π</button>
            <button onclick="append(Math.E)">e</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
